<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NotebookFlow - Production Launcher</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0b1020;
      color: #e8edf7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #111a2c;
      border: 1px solid #293650;
      border-radius: 18px;
      padding: 36px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 26px;
      margin-top: 0;
      margin-bottom: 12px;
      color: #8ca8ff;
    }
    p {
      color: #94a2bb;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #7c91ff;
      color: #0b1020;
      font-weight: 700;
      text-decoration: none;
      padding: 13px 26px;
      border-radius: 10px;
      font-size: 14px;
      transition: 0.2s;
    }
    .btn:hover {
      background: #9ab0ff;
      transform: translateY(-2px);
    }
    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 99px;
      font-size: 12px;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .badge-live {
      background: #0e2316;
      border: 1px solid #234e32;
      color: #4ade80;
    }
    .links {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 16px;
      font-size: 13px;
    }
    .links a {
      color: #7c91ff;
      text-decoration: none;
    }
    .links a:hover {
      text-decoration: underline;
    }
  </style>
  <script>
    // Automatically redirect if backend or Vite is running
    fetch('http://127.0.0.1:8000/api/health')
      .then(res => res.json())
      .then(data => {
        if (data.status === 'ok') {
          window.location.href = 'http://127.0.0.1:8000';
        }
      })
      .catch(() => {});
  </script>
</head>
<body>
  <div class="card">
    <div class="badge badge-live">● Server Ready</div>
    <h1>NotebookFlow Website</h1>
    <p>
      Your production web app is ready! The backend serves both the React UI and conversion API on port 8000.
    </p>
    <a href="http://127.0.0.1:8000" class="btn">Open Full Website (Port 8000) →</a>
    <div class="links">
      <a href="http://127.0.0.1:8000/docs" target="_blank">API Documentation</a>
      <a href="http://localhost:5173" target="_blank">Vite Dev Server (Port 5173)</a>
    </div>
  </div>
</body>
</html>
